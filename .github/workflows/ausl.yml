name: Update AUSL data

# theausl.com has no CORS-enabled API, so we fetch server-side here and publish
# docs/ausl.json to GitHub Pages for both apps to read same-origin.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch:          # manual "Run workflow" button
  push:
    paths:
      - "scripts/fetch_ausl.py"
      - ".github/workflows/ausl.yml"

# Avoid overlapping runs racing to commit.
concurrency:
  group: ausl-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract AUSL scores + standings
        run: python3 scripts/fetch_ausl.py docs/ausl.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/ausl.json; then
            echo "No AUSL changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ausl.json
          git commit -m "chore: update AUSL data [skip ci]"
          git push
