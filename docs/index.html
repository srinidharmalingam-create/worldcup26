<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday 26</title>
<meta name="description" content="Live softball, cricket, MLB, NFL, college football, NBA and NHL scores with US TV networks — in your local time zone.">
<meta name="application-name" content="Matchday 26">
<meta name="apple-mobile-web-app-title" content="Matchday 26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d2a1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg-top: #0d2a1c; --bg-bottom: #051219;
    --card: rgba(255,255,255,.06); --card-live: rgba(255,255,255,.10);
    --line: rgba(255,255,255,.09); --text: #f2f5f3; --dim: #93a59b;
    --gold: #f5c842; --red: #ff5252; --green: #4cd07d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 2px 14px; }
  header .trophy { font-size: 30px; }
  header h1 { font-size: 19px; font-weight: 800; }
  header .date { font-size: 12px; color: var(--dim); }
  header .dog { width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
                border: 1px solid rgba(255,255,255,0.2); margin-left: auto; }
  .leagues { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
  .leagues button {
    flex: 1 0 auto; min-width: 54px; padding: 6px 4px 5px; border: 0; border-radius: 12px;
    cursor: pointer; background: transparent; color: var(--dim); font-weight: 700; font-size: 9px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .leagues button .em { font-size: 17px; }
  .leagues button.on { background: rgba(255,255,255,.14); color: var(--text); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button {
    flex: 1; padding: 8px 0; border: 0; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--dim); font-weight: 700; font-size: 13px;
  }
  .tabs button.on { background: rgba(255,255,255,.14); color: var(--text); }
  .banner {
    display: flex; align-items: center; gap: 9px; padding: 12px; border-radius: 12px;
    margin-bottom: 12px; font-size: 13px;
  }
  .banner.count { background: rgba(245,200,66,.10); }
  .banner.count.soon { background: rgba(255,82,82,.12); }
  .banner.goal  { background: rgba(76,208,125,.14); border: 1px solid rgba(76,208,125,.4); }
  .banner .big { margin-left: auto; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
  .count .big { color: var(--gold); } .count.soon .big { color: var(--red); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px;
  }
  .card.live { background: var(--card-live); border-color: rgba(255,82,82,.5); }
  .card.fav { border-color: rgba(245,200,66,.45); }
  .teams { display: flex; align-items: flex-start; }
  .team { width: 34%; text-align: center; }
  .team img {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
    background: #fff; border: 1px solid rgba(255,255,255,.3);
  }
  .team.faved img, .team.faved .abbr { border: 2px solid var(--gold); }
  .team .abbr {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto;
    background: rgba(255,255,255,.9); color: #123; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.3);
  }
  .team .nm { font-size: 13px; font-weight: 600; margin-top: 5px; }
  .team .star { cursor: pointer; color: var(--dim); font-size: 12px; margin-left: 3px; }
  .team.faved .star { color: var(--gold); }
  .team.lost { opacity: .55; }
  .mid { flex: 1; text-align: center; padding-top: 8px; }
  .mid .score { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .mid .ko { font-size: 22px; font-weight: 800; }
  .mid .day { font-size: 10px; color: var(--dim); font-weight: 600; }
  .mid small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11px;
          color: var(--dim); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 9px; }
  .chip { padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.1);
          color: var(--text); font-weight: 600; font-size: 10px; }
  .chip.live { background: rgba(255,82,82,.18); color: var(--red); font-weight: 800; }
  .chip.ft { color: var(--dim); }
  .chip.up { background: rgba(245,200,66,.13); color: var(--gold); font-weight: 800; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--red); margin-right: 4px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tv { display: flex; align-items: center; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .tv .lbl { font-size: 10px; color: var(--dim); }
  .section { display: flex; align-items: center; gap: 8px; color: var(--dim);
             font-size: 11px; font-weight: 800; letter-spacing: .12em; margin: 16px 0 8px; }
  .section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12px;
         background: rgba(255,255,255,.04); border-radius: 10px; margin-bottom: 6px; }
  .row.live { background: rgba(255,255,255,.08); }
  .row .t { font-weight: 600; flex: 1; }
  .row .when { color: var(--dim); min-width: 62px; }
  .cricket-side { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .cricket-side img { width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .cricket-side .cs { margin-left: auto; font-family: ui-monospace, Menlo, monospace;
                      font-size: 11px; white-space: nowrap; }
  .cricket-side .nm2 { font-size: 12px; font-weight: 600; }
  .cricket-side.w .nm2, .cricket-side.w .cs { font-weight: 800; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { color: var(--dim); font-size: 10px; font-weight: 600; text-align: right; padding: 2px 4px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 4px; text-align: right; font-variant-numeric: tabular-nums; }
  td.teamcell { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  td img { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  tr.faved td { color: var(--gold); }
  .center { text-align: center; color: var(--dim); padding: 30px 0; font-size: 13px; }
  footer { text-align: center; color: var(--dim); font-size: 11px; margin-top: 22px; }
  footer a { color: var(--dim); }
  .err { background: rgba(255,150,50,.12); color: #ffb35c; padding: 10px;
         border-radius: 10px; font-size: 12px; margin-bottom: 10px; }
  .gc { margin-left: auto; color: var(--dim); text-decoration: none; font-weight: 700;
        font-size: 11px; white-space: nowrap; cursor: pointer; }
  .gc:hover { color: var(--text); }
  .row .gc { margin-left: 0; }
  .tlink { color: inherit; text-decoration: none; }
  .tlink:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="trophy">🥎</span>
    <div>
      <h1>Matchday <span style="font-weight:400;color:var(--dim);font-size:13px">live scores</span></h1>
      <div class="date" id="today"></div>
    </div>
    <img class="dog" src="dog.jpg" alt="Dog">
  </header>
  <nav class="leagues" id="leagues"></nav>
  <div id="lgsettings" style="display:none"></div>
  <main id="view"><div class="center">Loading today's games…</div></main>
  <footer>
    Times shown in your time zone (<span id="tz"></span>) · TV listings are US national networks<br>
    Data: ESPN · <a href="https://github.com/srinidharmalingam-create/worldcup26">Get the Mac menu bar app</a>
  </footer>
</div>
<script data-goatcounter="https://worldcup26sports.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// Privacy-friendly usage events (GoatCounter: no cookies, no personal data)
function track(name) {
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path: name, event: true });
  }
}
document.addEventListener("click", e => {
  if (e.target.closest(".gc")) track("open-gamecast");
  else if (e.target.closest(".tlink")) track("open-team-page");
  else if (e.target.closest(".star")) track("toggle-favorite");
});

const SITE = "https://site.api.espn.com/apis/site/v2/sports";
const LEAGUES = [
  { key: "softball", em: "🥎", label: "Softball", path: "baseball/college-softball", standings: true, tomorrow: true },
  { key: "cricket",  em: "🏏", label: "Cricket" },
  { key: "mlb",      em: "⚾️", label: "MLB", path: "baseball/mlb", standings: true, tomorrow: true },
  { key: "nfl",      em: "🏈", label: "NFL", path: "football/nfl", standings: true },
  { key: "cfb",      em: "🎓", label: "CFB", path: "football/college-football", cap: 30 },
  { key: "nba",      em: "🏀", label: "NBA", path: "basketball/nba", standings: true, tomorrow: true },
  { key: "nhl",      em: "🏒", label: "NHL", path: "hockey/nhl", standings: true, tomorrow: true },
];
const NAV_EXTRAS = [
  { key: "guide", em: "📺", label: "Today" },
  { key: "mine",  em: "⭐️", label: "My Teams" },
];
const lg = k => LEAGUES.find(l => l.key === k);

const state = {
  view: "guide", subView: "games",
  games: {}, cricket: [], standings: {}, winProb: {}, expanded: new Set(),
  hidden: new Set(JSON.parse(localStorage.getItem("hiddenLg") || "[]")),
  // World Cup favourites are dropped — that league is no longer carried.
  favs: new Set(JSON.parse(localStorage.getItem("favs2") || "[]")
    .filter(k => k.includes(":") && !k.startsWith("worldCup:"))),
  prevScores: {}, alertMsg: null, alertAt: 0, error: null, loaded: false,
};
localStorage.setItem("favs2", JSON.stringify([...state.favs]));

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
document.getElementById("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

// MARK: nav

const leaguesNav = document.getElementById("leagues");
function visibleLeagues() {
  const shown = LEAGUES.filter(l => !state.hidden.has(l.key));
  return shown.length ? shown : LEAGUES;
}
function renderNav() {
  const items = [...NAV_EXTRAS, ...visibleLeagues()];
  leaguesNav.innerHTML = items.map(l =>
    `<button data-lg="${l.key}" class="${l.key === state.view ? "on" : ""}"><span class="em">${l.em}</span>${l.label}</button>`).join("")
    + `<button data-lg="__settings" title="Choose leagues"><span class="em">⚙️</span>Leagues</button>`;
}
function renderLgSettings() {
  const panel = document.getElementById("lgsettings");
  panel.innerHTML = `<div class="card" style="margin-bottom:12px"><b style="font-size:12px">Show leagues</b><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">` +
    LEAGUES.map(l =>
      `<label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" data-hide="${l.key}" ${state.hidden.has(l.key) ? "" : "checked"}> ${l.em} ${l.label}</label>`).join("") +
    `</div></div>`;
  panel.querySelectorAll("input[data-hide]").forEach(cb => cb.addEventListener("change", () => {
    cb.checked ? state.hidden.delete(cb.dataset.hide) : state.hidden.add(cb.dataset.hide);
    localStorage.setItem("hiddenLg", JSON.stringify([...state.hidden]));
    if (state.hidden.has(state.view)) state.view = "guide";
    renderNav(); render();
  }));
}
leaguesNav.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lg === "__settings") {
    const panel = document.getElementById("lgsettings");
    const show = panel.style.display === "none";
    if (show) renderLgSettings();
    panel.style.display = show ? "block" : "none";
    return;
  }
  state.view = b.dataset.lg;
  state.subView = "games";
  track("view-" + b.dataset.lg);
  renderNav(); render();
});
renderNav();

// MARK: parsing

const NET = { Tele: "Telemundo", TELE: "Telemundo", Uni: "Universo" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtTime = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const fmtDay  = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const isToday = d => d.toDateString() === new Date().toDateString();
const ymd = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();

function parseMatch(ev) {
  const c = ev.competitions?.[0]; if (!c || !c.competitors || c.competitors.length < 2) return null;
  const pick = (ha, i) => c.competitors.find(t => t.homeAway === ha) || c.competitors[i];
  const side = (ha, i) => {
    const x = pick(ha, i) || {};
    const num = x.score != null && /^\d+$/.test(String(x.score)) ? +x.score : null;
    const links = x.team?.links || [];
    const site = (links.find(l => (l.rel || []).includes("clubhouse")) || links[0])?.href || null;
    // Some leagues (NCAA softball) return a generic placeholder crest.
    const rawLogo = x.team?.logo || "";
    return { id: x.team?.id || "", name: x.team?.displayName || "—",
             ab: x.team?.abbreviation || (x.team?.displayName || "?").slice(0, 3).toUpperCase(),
             logo: rawLogo.endsWith("/logos/default.png") ? "" : rawLogo, score: num,
             scoreText: x.score != null && String(x.score).length ? String(x.score) : null,
             win: x.winner === true || x.winner === "true", site,
             periods: (x.linescores || []).map(l => l.value == null ? "-" : Math.round(l.value)) };
  };
  const st = c.status?.type?.state === "in" ? "live" : c.status?.type?.state === "post" ? "post" : "pre";
  const nets = [...new Set((c.broadcasts || []).flatMap(b => b.names || []).map(n => NET[n] || n))];
  const link = (ev.links || []).find(l => (l.rel || []).includes("summary"))?.href || null;
  return { id: ev.id, ko: new Date(ev.date), home: side("home", 0), away: side("away", 1),
           state: st, clock: c.status?.displayClock || "",
           detail: c.status?.type?.shortDetail || "",
           venue: c.venue?.fullName || "", city: c.venue?.address?.city || "",
           nets, link };
}

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
const parseBoard = b => (b.events || []).map(parseMatch).filter(Boolean);
const byLive = (a, b) => (a.state === "live" ? 0 : 1) - (b.state === "live" ? 0 : 1) || a.ko - b.ko;

async function fetchCricket() {
  const head = await getJSON("https://site.web.api.espn.com/apis/personalized/v2/scoreboard/header?sport=cricket");
  const leagues = (head.sports || []).flatMap(s => s.leagues || [])
    .filter(l => l.id && (l.events || []).length);
  const pri = n => { n = (n || "").toLowerCase();
    if (/icc|world cup|world test/.test(n)) return 0;
    if (/test|odi|t20i|tour|tri-series|trophy/.test(n)) return 1;
    if (/county|big bash|hundred|ipl|super smash/.test(n)) return 2; return 3; };
  const picked = leagues.sort((a, b) => pri(a.name) - pri(b.name)).slice(0, 5);
  const out = [];
  await Promise.all(picked.map(async l => {
    try {
      const b = await getJSON(`${SITE}/cricket/${l.id}/scoreboard`);
      const ms = parseBoard(b).sort(byLive);
      if (ms.length) out.push({ title: b.leagues?.[0]?.name || l.name, ms });
    } catch {}
  }));
  return out;
}

async function refresh() {
  const tmr = new Date(Date.now() + 864e5);
  const safe = p => p.catch(() => null);
  const jobs = LEAGUES.filter(l => l.path).map(async l => {
    const today = await safe(getJSON(`${SITE}/${l.path}/scoreboard`));
    if (!today) return;
    let games = parseBoard(today);
    if (l.tomorrow) {
      const next = await safe(getJSON(`${SITE}/${l.path}/scoreboard?dates=${ymd(tmr)}`));
      if (next) {
        const ids = new Set(games.map(m => m.id));
        games = games.concat(parseBoard(next).filter(m => !ids.has(m.id)));
      }
    }
    games.sort(byLive);
    if (l.cap) games = games.slice(0, l.cap);
    detectScores(l, games);
    state.games[l.key] = games;
  });
  jobs.push((async () => { const c = await safe(fetchCricket()); if (c) state.cricket = c; })());
  await Promise.all(jobs);
  state.error = Object.keys(state.games).length ? null : "Couldn't reach ESPN — retrying shortly.";
  state.loaded = true;
  render(); updateTitle();
}

function detectScores(league, games) {
  for (const m of games) {
    if (m.state === "pre" || m.home.score == null || m.away.score == null) continue;
    const prev = state.prevScores[m.id], tot = m.home.score + m.away.score;
    if (prev != null && tot > prev.t && !state.hidden.has(league.key)) {
      const who = m.home.score > prev.h ? m.home.ab : m.away.ab;
      const detail = m.detail && m.detail.toLowerCase() !== "live" ? " · " + m.detail : "";
      state.alertMsg = `${league.em} ${who} scores! ${m.home.ab} ${m.home.score}–${m.away.score} ${m.away.ab}${detail}`;
      state.alertAt = Date.now();
    }
    state.prevScores[m.id] = { t: tot, h: m.home.score };
  }
}

async function loadStandings(key) {
  if (state.standings[key]) return;
  const path = lg(key)?.path; if (!path) return;
  state.standings[key] = null;
  try {
    const d = await getJSON(`https://site.api.espn.com/apis/v2/sports/${path}/standings`);
    state.standings[key] = (d.children || []).map(g => ({
      name: g.name,
      rows: (g.standings?.entries || []).map(e => {
        const v = k => e.stats.find(s => s.name === k);
        return { id: e.team.id, name: e.team.displayName, logo: e.team.logos?.[0]?.href || "",
                 w: Math.round(v("wins")?.value ?? 0), l: Math.round(v("losses")?.value ?? 0),
                 pct: v("winPercent")?.displayValue || "—" };
      }).sort((a, b) => (parseFloat(b.pct) || 0) - (parseFloat(a.pct) || 0) || b.w - a.w),
    }));
  } catch { state.standings[key] = []; }
  render();
}

async function loadWinProb(key, id) {
  if (state.winProb[id] !== undefined) return;
  state.winProb[id] = null;
  const path = lg(key)?.path; if (!path) return;
  try {
    const d = await getJSON(`${SITE}/${path}/summary?event=${id}`);
    const wp = d.winprobability;
    if (wp && wp.length) state.winProb[id] = wp[wp.length - 1].homeWinPercentage;
  } catch {}
  render();
}

function toggleBox(key, id, live) {
  state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
  track("box-score");
  if (state.expanded.has(id) && live) loadWinProb(key, id);
  render();
}

// MARK: title ticker

const STATIC_TITLE = "Matchday 26";
function allGames() {
  const out = [];
  for (const l of visibleLeagues()) {
    const pool = l.key === "cricket" ? state.cricket.flatMap(s => s.ms) : (state.games[l.key] || []);
    for (const m of pool) out.push({ l, m });
  }
  return out;
}
function updateTitle() {
  // Static while visible so bookmarks get a clean name; ticker in background tabs.
  if (document.visibilityState === "visible") { document.title = STATIC_TITLE; return; }
  if (state.alertMsg && Date.now() - state.alertAt < 18e4) { document.title = state.alertMsg; return; }
  const games = allGames();
  const live = games.filter(g => g.m.state === "live");
  const head = live.find(g => isFav(g.m, g.l.key)) || live[0];
  if (head) {
    const m = head.m;
    document.title = head.l.key === "cricket" || m.home.score == null
      ? `${head.l.em} ${m.home.ab} v ${m.away.ab}`
      : `${head.l.em} ${m.home.ab} ${m.home.score}–${m.away.score} ${m.away.ab}`;
    return;
  }
  const next = games.filter(g => g.m.state === "pre" && g.m.ko > new Date())
    .sort((a, b) => a.m.ko - b.m.ko)[0];
  document.title = next ? `${next.l.em} ${next.m.home.ab}–${next.m.away.ab} ${fmtTime(next.m.ko)}` : STATIC_TITLE;
}
document.addEventListener("visibilitychange", updateTitle);

// MARK: favourites

const isFav = (m, key) => state.favs.has(`${key}:${m.home.id}`) || state.favs.has(`${key}:${m.away.id}`);
function toggleFav(key, id) {
  const k = `${key}:${id}`;
  state.favs.has(k) ? state.favs.delete(k) : state.favs.add(k);
  localStorage.setItem("favs2", JSON.stringify([...state.favs]));
  render();
}

// MARK: rendering

function teamHTML(t, lost, key) {
  const fav = state.favs.has(`${key}:${t.id}`);
  const nm = t.site ? `<a class="tlink" href="${esc(t.site)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : esc(t.name);
  return `<div class="team ${fav ? "faved" : ""} ${lost ? "lost" : ""}">
    ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : `<div class="abbr">${esc(t.ab)}</div>`}
    <div class="nm">${nm}<span class="star" onclick="toggleFav('${key}','${esc(t.id)}')">${fav ? "★" : "☆"}</span></div>
  </div>`;
}

function cardHTML(m, key) {
  const lostH = m.state === "post" && m.away.win && !m.home.win;
  const lostA = m.state === "post" && m.home.win && !m.away.win;
  const mid = m.state === "pre"
    ? `${isToday(m.ko) ? "" : `<div class="day">${fmtDay(m.ko)}</div>`}<div class="ko">${fmtTime(m.ko)}</div><small>Start</small>`
    : `<div class="score">${m.home.score ?? 0} – ${m.away.score ?? 0}</div>`;
  const extra = m.detail && m.detail.toLowerCase() !== "live" ? " · " + esc(m.detail) : "";
  const chip = m.state === "live" ? `<span class="chip live"><span class="dot"></span>LIVE${extra}</span>`
    : m.state === "post" ? `<span class="chip ft">${esc(m.detail || "Final")}</span>`
    : `<span class="chip up">UPCOMING</span>`;
  const hasBox = m.home.periods.length || m.away.periods.length;
  return `<div class="card ${m.state === "live" ? "live" : ""} ${isFav(m, key) ? "fav" : ""}">
    <div class="teams">${teamHTML(m.home, lostH, key)}
      <div class="mid">${mid}</div>${teamHTML(m.away, lostA, key)}</div>
    <div class="meta">${chip}<span>${esc(m.venue)}${m.city ? " · " + esc(m.city) : ""}</span>
      ${m.state !== "pre" && hasBox
        ? `<a class="gc" onclick="toggleBox('${key}','${esc(m.id)}',${m.state === "live"})">${state.expanded.has(m.id) ? "Hide ▴" : "Box score ▾"}</a>` : ""}
      ${m.link ? `<a class="gc" href="${esc(m.link)}" target="_blank" rel="noopener">Gamecast ↗</a>` : ""}</div>
    ${m.nets.length ? `<div class="tv"><span class="lbl">📺</span>${m.nets.map(n => `<span class="chip">${esc(n)}</span>`).join("")}</div>` : ""}
    ${state.expanded.has(m.id) ? boxScoreHTML(m) : ""}
  </div>`;
}

function boxScoreHTML(m) {
  const count = Math.max(m.home.periods.length, m.away.periods.length);
  const row = t => `<tr><td style="font-weight:800">${esc(t.ab)}</td>` +
    Array.from({ length: count }, (_, i) => `<td>${t.periods[i] ?? "-"}</td>`).join("") +
    `<td style="font-weight:800">${t.score ?? 0}</td></tr>`;
  const wp = state.winProb[m.id];
  const wpHTML = m.state === "live" && wp != null
    ? `<div style="margin-top:7px;font-size:10px;color:var(--dim)">Win probability
         <b style="color:var(--text)">${esc(m.home.ab)} ${Math.round(wp * 100)}% – ${100 - Math.round(wp * 100)}% ${esc(m.away.ab)}</b>
         <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:3px">
           <div style="height:4px;border-radius:2px;background:var(--green);width:${Math.round(wp * 100)}%"></div></div></div>`
    : "";
  return `<div style="background:rgba(0,0,0,.2);border-radius:10px;padding:8px;margin-top:8px">
    <table style="font-family:ui-monospace,Menlo,monospace;font-size:10px">
      <tr style="color:var(--dim)"><td></td>${Array.from({ length: count }, (_, i) => `<td>${i + 1}</td>`).join("")}<td><b>T</b></td></tr>
      ${row(m.home)}${row(m.away)}
    </table>${wpHTML}</div>`;
}

function cricketCardHTML(m) {
  const side = t => {
    const fav = state.favs.has(`cricket:${t.id}`);
    const nm = t.site ? `<a class="tlink" href="${esc(t.site)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : esc(t.name);
    return `<div class="cricket-side ${t.win ? "w" : ""}">
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
      <span class="nm2">${nm}</span>
      <span class="star" style="cursor:pointer;color:${fav ? "var(--gold)" : "var(--dim)"};font-size:11px"
            onclick="toggleFav('cricket','${esc(t.id)}')">${fav ? "★" : "☆"}</span>
      <span class="cs">${esc(t.scoreText || "—")}</span></div>`;
  };
  const extra = m.detail && m.detail.toLowerCase() !== "live" ? " · " + esc(m.detail) : "";
  const chip = m.state === "live" ? `<span class="chip live"><span class="dot"></span>LIVE${extra}</span>`
    : m.state === "post" ? `<span class="chip ft">${esc(m.detail || "Result")}</span>`
    : `<span class="chip up">${fmtDay(m.ko)} ${fmtTime(m.ko)}</span>`;
  return `<div class="card ${m.state === "live" ? "live" : ""}">
    ${side(m.home)}${side(m.away)}
    <div class="meta">${chip}<span>${esc(m.venue)}</span>
      ${m.link ? `<a class="gc" href="${esc(m.link)}" target="_blank" rel="noopener">Scorecard ↗</a>` : ""}</div></div>`;
}

function guideEntries() {
  return allGames()
    .filter(g => g.m.state !== "post" && (g.m.state === "live" || isToday(g.m.ko)))
    .sort((a, b) => byLive(a.m, b.m));
}
function myTeamEntries() {
  return allGames().filter(g => isFav(g.m, g.l.key)).sort((a, b) => byLive(a.m, b.m));
}

function guideRowHTML(e) {
  const m = e.m;
  const when = m.state === "live"
    ? `<span style="color:var(--red);font-weight:800;font-size:10px"><span class="dot"></span>LIVE</span>`
    : `<span style="font-weight:700">${fmtTime(m.ko)}</span>`;
  const score = m.state === "live" && m.home.score != null && e.l.key !== "cricket"
    ? `${esc(m.home.ab)} ${m.home.score}–${m.away.score} ${esc(m.away.ab)}`
    : `${esc(m.home.ab)} v ${esc(m.away.ab)}`;
  return `<div class="row ${m.state === "live" ? "live" : ""}">
    <span class="when">${when}</span><span>${e.l.em}</span>
    <span class="t">${isFav(m, e.l.key) ? "⭐ " : ""}${score}</span>
    <span style="color:var(--dim);font-size:10px">${esc(m.nets.slice(0, 2).join(" · "))}</span>
    ${m.link ? `<a class="gc" href="${esc(m.link)}" target="_blank" rel="noopener">↗</a>` : ""}</div>`;
}

function countdownHTML(e) {
  const s = Math.max(0, (e.m.ko - Date.now()) / 1000), soon = s <= 600;
  const cd = s >= 3600 ? `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`
                       : `${Math.floor(s / 60)}m ${String(Math.floor(s % 60)).padStart(2, "0")}s`;
  return `<div class="banner count ${soon ? "soon" : ""}">${soon ? "🔔" : "⏱"}
    <div><b>${e.l.em} ${esc(e.m.home.ab)} v ${esc(e.m.away.ab)}</b><br>
    <span style="color:var(--dim);font-size:11px">${soon ? "Starting soon!" : "Next up"}</span></div>
    <span class="big">${cd}</span></div>`;
}

function standingsHTML(key) {
  const tables = state.standings[key];
  if (tables === undefined) { loadStandings(key); return `<div class="center">Loading standings…</div>`; }
  if (tables === null) return `<div class="center">Loading standings…</div>`;
  if (!tables.length) return `<div class="center">Standings unavailable</div>`;
  return tables.map(t => `<div class="card"><table>
    <tr><th>${esc(t.name)}</th><th>W</th><th>L</th><th>PCT</th></tr>
    ${t.rows.map(r => `<tr class="${state.favs.has(key + ":" + r.id) ? "faved" : ""}">
      <td class="teamcell">${r.logo ? `<img src="${esc(r.logo)}" alt="" loading="lazy">` : ""}${esc(r.name)}</td>
      <td>${r.w}</td><td>${r.l}</td><td>${esc(r.pct)}</td></tr>`).join("")}
    </table></div>`).join("");
}

function render() {
  const v = document.getElementById("view");
  let h = state.error ? `<div class="err">${esc(state.error)}</div>` : "";

  if (state.view === "guide") {
    const entries = guideEntries();
    const live = entries.filter(e => e.m.state === "live"), up = entries.filter(e => e.m.state !== "live");
    if (state.alertMsg && Date.now() - state.alertAt < 18e4)
      h += `<div class="banner goal"><b>${esc(state.alertMsg)}</b></div>`;
    if (!entries.length) h += state.loaded ? `<div class="center">Nothing on today</div>` : `<div class="center">Loading today's games…</div>`;
    if (!live.length && up.length) h += countdownHTML(up[0]);
    if (live.length) h += `<div class="section">LIVE NOW</div>` + live.map(guideRowHTML).join("");
    if (up.length) h += `<div class="section">COMING UP TODAY</div>` + up.map(guideRowHTML).join("");
    v.innerHTML = h; return;
  }

  if (state.view === "mine") {
    const entries = myTeamEntries();
    if (!state.favs.size) {
      h += `<div class="center">⭐️<br><b>No teams followed yet</b><br>Tap the ☆ next to any team name to follow it across every sport.</div>`;
    } else if (!entries.length) {
      h += `<div class="center">No games right now for your teams</div>`;
    }
    h += entries.map(e => e.l.key === "cricket" ? cricketCardHTML(e.m) : cardHTML(e.m, e.l.key)).join("");
    v.innerHTML = h; return;
  }

  const league = lg(state.view);
  if (league?.standings) {
    h += `<nav class="tabs">
      <button class="${state.subView === "games" ? "on" : ""}" onclick="state.subView='games';render()">Games</button>
      <button class="${state.subView === "standings" ? "on" : ""}" onclick="state.subView='standings';track('standings-${state.view}');render()">Standings</button></nav>`;
  }
  if (league?.standings && state.subView === "standings") {
    h += standingsHTML(state.view);
  } else if (state.view === "cricket") {
    h += state.cricket.length
      ? state.cricket.map(s => `<div class="section">${esc(s.title).toUpperCase()}</div>` + s.ms.map(cricketCardHTML).join("")).join("")
      : `<div class="center">${state.loaded ? "No cricket matches right now" : "Loading…"}</div>`;
  } else {
    const pool = state.games[state.view] || [];
    h += pool.length ? pool.map(m => cardHTML(m, state.view)).join("")
      : `<div class="center">${state.loaded ? `No ${esc(league?.label || "")} games scheduled` : "Loading…"}</div>`;
  }
  v.innerHTML = h;
}

refresh();
setInterval(refresh, 60e3);
setInterval(() => {
  // keep the countdown ticking and expire stale score alerts
  if (state.view === "guide") render();
  updateTitle();
}, 1e3);
</script>
</body>
</html>
