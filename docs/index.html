<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚽️ World Cup 2026 + Live Sports</title>
<meta name="description" content="Live 2026 FIFA World Cup, cricket, NFL, NBA and NHL scores with US TV networks — in your local time zone.">
<style>
  :root {
    --bg-top: #0d2a1c; --bg-bottom: #051219;
    --card: rgba(255,255,255,.06); --card-live: rgba(255,255,255,.10);
    --line: rgba(255,255,255,.09); --text: #f2f5f3; --dim: #93a59b;
    --gold: #f5c842; --red: #ff5252; --green: #4cd07d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 2px 14px; }
  header .trophy { font-size: 30px; }
  header h1 { font-size: 19px; font-weight: 800; }
  header .date { font-size: 12px; color: var(--dim); }
  .leagues { display: flex; gap: 5px; margin-bottom: 10px; }
  .leagues button {
    flex: 1; padding: 6px 0 5px; border: 0; border-radius: 12px; cursor: pointer;
    background: transparent; color: var(--dim); font-weight: 700; font-size: 9px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .leagues button .em { font-size: 17px; }
  .leagues button.on { background: rgba(255,255,255,.14); color: var(--text); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button {
    flex: 1; padding: 8px 0; border: 0; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--dim); font-weight: 700; font-size: 13px;
  }
  .tabs button.on { background: rgba(255,255,255,.14); color: var(--text); }
  .banner {
    display: flex; align-items: center; gap: 9px; padding: 12px; border-radius: 12px;
    margin-bottom: 12px; font-size: 13px;
  }
  .banner.count { background: rgba(245,200,66,.10); }
  .banner.live  { background: rgba(255,82,82,.12); border: 1px solid rgba(255,82,82,.35); }
  .banner.goal  { background: rgba(76,208,125,.14); border: 1px solid rgba(76,208,125,.4); }
  .banner .big { margin-left: auto; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
  .count .big { color: var(--gold); } .count.soon .big { color: var(--red); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px;
  }
  .card.live { background: var(--card-live); border-color: rgba(255,82,82,.5); }
  .card.fav { border-color: rgba(245,200,66,.45); }
  .teams { display: flex; align-items: flex-start; }
  .team { width: 34%; text-align: center; }
  .team img {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
    background: #fff; border: 1px solid rgba(255,255,255,.3);
  }
  .team.faved img { border: 2px solid var(--gold); }
  .team .nm { font-size: 13px; font-weight: 600; margin-top: 5px; }
  .team .star { cursor: pointer; color: var(--dim); font-size: 12px; margin-left: 3px; }
  .team.faved .star { color: var(--gold); }
  .team.lost { opacity: .55; }
  .form { display: flex; gap: 3px; justify-content: center; margin-top: 5px; }
  .form i { width: 6px; height: 6px; border-radius: 50%; background: #777; }
  .form i.W { background: var(--green); } .form i.L { background: var(--red); }
  .mid { flex: 1; text-align: center; padding-top: 8px; }
  .mid .score { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .mid .ko { font-size: 22px; font-weight: 800; }
  .mid .day { font-size: 10px; color: var(--dim); font-weight: 600; }
  .mid small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11px;
          color: var(--dim); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 9px; }
  .chip { padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.1);
          color: var(--text); font-weight: 600; font-size: 10px; }
  .chip.live { background: rgba(255,82,82,.18); color: var(--red); font-weight: 800; }
  .chip.ft { color: var(--dim); }
  .chip.up { background: rgba(245,200,66,.13); color: var(--gold); font-weight: 800; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--red); margin-right: 4px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tv { display: flex; align-items: center; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .tv .lbl { font-size: 10px; color: var(--dim); }
  .section { display: flex; align-items: center; gap: 8px; color: var(--dim);
             font-size: 11px; font-weight: 800; letter-spacing: .12em; margin: 16px 0 8px; }
  .section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12px;
         background: rgba(255,255,255,.04); border-radius: 10px; margin-bottom: 6px; }
  .row .t { font-weight: 600; flex: 1; }
  .row .c { font-weight: 800; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
  .row .c.live { color: var(--red); }
  .row .when { color: var(--dim); min-width: 70px; text-align: center; }
  .cricket-side { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .cricket-side img { width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .cricket-side .cs { margin-left: auto; font-family: ui-monospace, Menlo, monospace;
                      font-size: 11px; white-space: nowrap; }
  .cricket-side .nm2 { font-size: 12px; font-weight: 600; }
  .cricket-side.w .nm2, .cricket-side.w .cs { font-weight: 800; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { color: var(--dim); font-size: 10px; font-weight: 600; text-align: right; padding: 2px 4px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 4px; text-align: right; font-variant-numeric: tabular-nums; }
  td.teamcell { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  td img { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  tr.q td:first-child { border-left: 2px solid var(--green); }
  tr.faved td { color: var(--gold); }
  .center { text-align: center; color: var(--dim); padding: 30px 0; font-size: 13px; }
  footer { text-align: center; color: var(--dim); font-size: 11px; margin-top: 22px; }
  footer a { color: var(--dim); }
  .err { background: rgba(255,150,50,.12); color: #ffb35c; padding: 10px;
         border-radius: 10px; font-size: 12px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="trophy">🏆</span>
    <div>
      <h1>World Cup 2026 <span style="font-weight:400;color:var(--dim);font-size:13px">+ live sports</span></h1>
      <div class="date" id="today"></div>
    </div>
  </header>
  <nav class="leagues" id="leagues"></nav>
  <nav class="tabs" id="wctabs">
    <button data-tab="matches" class="on">Matches</button>
    <button data-tab="groups">Groups</button>
    <button data-tab="bracket">Bracket</button>
  </nav>
  <main id="view"><div class="center">Loading matches…</div></main>
  <footer>
    Times shown in your time zone (<span id="tz"></span>) · TV listings are US national networks<br>
    Data: ESPN · <a href="https://github.com/srinidharmalingam-create/worldcup26">Get the Mac menu bar app</a>
  </footer>
</div>
<script>
const SITE = "https://site.api.espn.com/apis/site/v2/sports";
const API = `${SITE}/soccer/fifa.world`;
const LEAGUES = [
  { key: "worldCup", em: "⚽️", label: "World Cup" },
  { key: "cricket",  em: "🏏", label: "Cricket" },
  { key: "nfl",      em: "🏈", label: "NFL", path: "football/nfl" },
  { key: "nba",      em: "🏀", label: "NBA", path: "basketball/nba" },
  { key: "nhl",      em: "🏒", label: "NHL", path: "hockey/nhl" },
];
const state = { league: "worldCup", tab: "matches", today: [], tomorrow: [], groups: [], bracket: [],
                nfl: [], nba: [], nhl: [], cricket: [],
                favs: new Set(JSON.parse(localStorage.getItem("favs2") || "[]")),
                prevScores: {}, goalMsg: null, goalAt: 0, error: null };

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
document.getElementById("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

const leaguesNav = document.getElementById("leagues");
leaguesNav.innerHTML = LEAGUES.map(l =>
  `<button data-lg="${l.key}" class="${l.key === "worldCup" ? "on" : ""}"><span class="em">${l.em}</span>${l.label}</button>`).join("");
leaguesNav.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.league = b.dataset.lg;
  leaguesNav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  document.getElementById("wctabs").style.display = state.league === "worldCup" ? "flex" : "none";
  render();
});
document.getElementById("wctabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.tab = b.dataset.tab;
  document.querySelectorAll("#wctabs button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

const NET = { Tele: "Telemundo", TELE: "Telemundo", Uni: "Universo" };
const ROUND = { "group-stage": "Group Stage", "round-of-32": "Round of 32", "round-of-16": "Round of 16",
  quarterfinals: "Quarterfinals", quarterfinal: "Quarterfinals", semifinals: "Semifinals",
  semifinal: "Semifinals", "3rd-place-match": "Third Place", final: "Final" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtTime = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const fmtDay  = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const isToday = d => d.toDateString() === new Date().toDateString();

function parseMatch(ev) {
  const c = ev.competitions?.[0]; if (!c || !c.competitors || c.competitors.length < 2) return null;
  const pick = (ha, i) => c.competitors.find(t => t.homeAway === ha) || c.competitors[i];
  const side = (ha, i) => {
    const x = pick(ha, i) || {};
    const num = x.score != null && /^\d+$/.test(String(x.score)) ? +x.score : null;
    return { id: x.team?.id || "", name: x.team?.displayName || "—",
             ab: x.team?.abbreviation || (x.team?.displayName || "?").slice(0, 3).toUpperCase(),
             logo: x.team?.logo || "", score: num,
             scoreText: x.score != null && String(x.score).length ? String(x.score) : null,
             win: x.winner === true || x.winner === "true", form: x.form || "" };
  };
  const st = c.status?.type?.state === "in" ? "live" : c.status?.type?.state === "post" ? "post" : "pre";
  const nets = [...new Set((c.broadcasts || []).flatMap(b => b.names || []).map(n => NET[n] || n))];
  return { id: ev.id, ko: new Date(ev.date), home: side("home", 0), away: side("away", 1),
           state: st, clock: c.status?.displayClock || "",
           detail: c.status?.type?.shortDetail || "",
           venue: c.venue?.fullName || "", city: c.venue?.address?.city || "",
           nets, slug: ev.season?.slug || "group-stage" };
}

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
const ymd = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const parseBoard = b => (b.events || []).map(parseMatch).filter(Boolean);

async function fetchCricket() {
  const head = await getJSON("https://site.web.api.espn.com/apis/personalized/v2/scoreboard/header?sport=cricket");
  const leagues = (head.sports || []).flatMap(s => s.leagues || [])
    .filter(l => l.id && (l.events || []).length);
  const pri = n => { n = (n || "").toLowerCase();
    if (/icc|world cup|world test/.test(n)) return 0;
    if (/test|odi|t20i|tour|tri-series|trophy/.test(n)) return 1;
    if (/county|big bash|hundred|ipl|super smash/.test(n)) return 2; return 3; };
  const picked = leagues.sort((a, b) => pri(a.name) - pri(b.name)).slice(0, 5);
  const out = [];
  await Promise.all(picked.map(async lg => {
    try {
      const b = await getJSON(`${SITE}/cricket/${lg.id}/scoreboard`);
      const ms = parseBoard(b).sort((a, x) => (a.state === "live" ? 0 : 1) - (x.state === "live" ? 0 : 1) || a.ko - x.ko);
      if (ms.length) out.push({ title: b.leagues?.[0]?.name || lg.name, ms });
    } catch {}
  }));
  return out;
}

async function refresh() {
  try {
    const tmr = new Date(Date.now() + 864e5);
    const [t1, t2, st, br] = await Promise.all([
      getJSON(`${API}/scoreboard`), getJSON(`${API}/scoreboard?dates=${ymd(tmr)}`),
      getJSON(`https://site.api.espn.com/apis/v2/sports/soccer/fifa.world/standings?season=2026`),
      getJSON(`${API}/scoreboard?dates=20260628-20260720`),
    ]);
    // other sports are best-effort
    const safe = p => p.catch(() => null);
    const [nfl, nba1, nba2, nhl1, nhl2, cricket] = await Promise.all([
      safe(getJSON(`${SITE}/football/nfl/scoreboard`)),
      safe(getJSON(`${SITE}/basketball/nba/scoreboard`)), safe(getJSON(`${SITE}/basketball/nba/scoreboard?dates=${ymd(tmr)}`)),
      safe(getJSON(`${SITE}/hockey/nhl/scoreboard`)), safe(getJSON(`${SITE}/hockey/nhl/scoreboard?dates=${ymd(tmr)}`)),
      safe(fetchCricket()),
    ]);
    const merge = (a, b) => { const ids = new Set(a.map(m => m.id));
      return [...a, ...b.filter(m => !ids.has(m.id))].sort((x, y) => x.ko - y.ko); };
    if (nfl) state.nfl = parseBoard(nfl);
    if (nba1) state.nba = merge(parseBoard(nba1), nba2 ? parseBoard(nba2) : []);
    if (nhl1) state.nhl = merge(parseBoard(nhl1), nhl2 ? parseBoard(nhl2) : []);
    if (cricket) state.cricket = cricket;

    const today = parseBoard(t1).sort((a, b) => a.ko - b.ko);
    for (const m of today) {           // goal detection (World Cup only)
      if (m.state === "pre" || m.home.score == null) continue;
      const p = state.prevScores[m.id], tot = m.home.score + m.away.score;
      if (p != null && tot > p.t) {
        const who = m.home.score > p.h ? m.home.ab : m.away.ab;
        state.goalMsg = `🥅 GOAL ${who}! ${m.home.ab} ${m.home.score}–${m.away.score} ${m.away.ab} ${m.clock}`;
        state.goalAt = Date.now();
      }
      state.prevScores[m.id] = { t: tot, h: m.home.score };
    }
    const ids = new Set(today.map(m => m.id));
    state.today = today;
    state.tomorrow = parseBoard(t2).filter(m => !ids.has(m.id)).sort((a, b) => a.ko - b.ko);
    state.groups = (st.children || []).map(g => ({
      name: g.name,
      rows: (g.standings?.entries || []).map(e => {
        const v = k => +(e.stats.find(s => s.name === k)?.value ?? 0);
        return { id: e.team.id, name: e.team.displayName, logo: e.team.logos?.[0]?.href || "",
                 rank: v("rank"), p: v("gamesPlayed"), w: v("wins"), d: v("ties"), l: v("losses"),
                 gd: e.stats.find(s => s.name === "pointDifferential")?.displayValue || "0", pts: v("points") };
      }).sort((a, b) => a.rank - b.rank),
    })).sort((a, b) => a.name.localeCompare(b.name));
    const rounds = {};
    parseBoard(br).forEach(m => (rounds[m.slug] ??= []).push(m));
    state.bracket = Object.entries(rounds)
      .map(([slug, ms]) => ({ slug, title: ROUND[slug] || slug, ms: ms.sort((a, b) => a.ko - b.ko) }))
      .sort((a, b) => a.ms[0].ko - b.ms[0].ko);
    state.error = null;
  } catch (e) { state.error = "Couldn't reach ESPN — retrying soon."; }
  render(); updateTitle();
}

function updateTitle() {
  if (state.goalMsg && Date.now() - state.goalAt < 18e4) { document.title = state.goalMsg; return; }
  const live = state.today.find(m => m.state === "live" && isFav(m, "worldCup")) || state.today.find(m => m.state === "live");
  if (live) { document.title = `${live.home.ab} ${live.home.score}–${live.away.score} ${live.away.ab} ${live.clock}`; return; }
  for (const [k, pool, em] of [["nba", state.nba, "🏀"], ["nhl", state.nhl, "🏒"], ["nfl", state.nfl, "🏈"]]) {
    const g = pool.find(m => m.state === "live");
    if (g) { document.title = `${em} ${g.home.ab} ${g.home.score}–${g.away.score} ${g.away.ab}`; return; }
  }
  const next = [...state.today, ...state.tomorrow].find(m => m.state === "pre" && m.ko > new Date());
  document.title = next ? `⚽️ ${next.home.ab}–${next.away.ab} ${fmtTime(next.ko)}` : "⚽️ World Cup 2026";
}

const isFav = (m, lg) => state.favs.has(`${lg}:${m.home.id}`) || state.favs.has(`${lg}:${m.away.id}`);
function toggleFav(lg, id) {
  const k = `${lg}:${id}`;
  state.favs.has(k) ? state.favs.delete(k) : state.favs.add(k);
  localStorage.setItem("favs2", JSON.stringify([...state.favs]));
  render();
}

function teamHTML(t, lost, showForm, lg) {
  const fav = state.favs.has(`${lg}:${t.id}`);
  return `<div class="team ${fav ? "faved" : ""} ${lost ? "lost" : ""}">
    ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
    <div class="nm">${esc(t.name)}<span class="star" onclick="toggleFav('${lg}','${esc(t.id)}')">${fav ? "★" : "☆"}</span></div>
    ${showForm && t.form ? `<div class="form">${[...t.form.slice(0, 5)].map(c => `<i class="${c}"></i>`).join("")}</div>` : ""}
  </div>`;
}

function cardHTML(m, lg = "worldCup") {
  const lostH = m.state === "post" && m.away.win && !m.home.win;
  const lostA = m.state === "post" && m.home.win && !m.away.win;
  const mid = m.state === "pre"
    ? `${isToday(m.ko) ? "" : `<div class="day">${fmtDay(m.ko)}</div>`}<div class="ko">${fmtTime(m.ko)}</div><small>${lg === "worldCup" ? "Kickoff" : "Start"}</small>`
    : `<div class="score">${m.home.score ?? 0} – ${m.away.score ?? 0}</div>`;
  const extra = m.detail && m.detail.toLowerCase() !== "live" ? " · " + esc(m.detail) : "";
  const liveTxt = lg === "worldCup" ? `LIVE ${esc(m.clock)}` : `LIVE${extra}`;
  const chip = m.state === "live" ? `<span class="chip live"><span class="dot"></span>${liveTxt}</span>`
    : m.state === "post" ? `<span class="chip ft">${lg === "worldCup" ? "FT" : esc(m.detail || "Final")}</span>`
    : `<span class="chip up">UPCOMING</span>`;
  return `<div class="card ${m.state === "live" ? "live" : ""} ${isFav(m, lg) ? "fav" : ""}">
    <div class="teams">${teamHTML(m.home, lostH, m.state === "pre" && lg === "worldCup", lg)}
      <div class="mid">${mid}</div>${teamHTML(m.away, lostA, m.state === "pre" && lg === "worldCup", lg)}</div>
    <div class="meta">${chip}<span>${esc(m.venue)}${m.city ? " · " + esc(m.city) : ""}</span></div>
    ${m.nets.length ? `<div class="tv"><span class="lbl">📺</span>${m.nets.map(n => `<span class="chip">${esc(n)}</span>`).join("")}</div>` : ""}
  </div>`;
}

function cricketCardHTML(m) {
  const side = t => {
    const fav = state.favs.has(`cricket:${t.id}`);
    return `<div class="cricket-side ${t.win ? "w" : ""}">
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
      <span class="nm2">${esc(t.name)}</span>
      <span class="star" style="cursor:pointer;color:${fav ? "var(--gold)" : "var(--dim)"};font-size:11px"
            onclick="toggleFav('cricket','${esc(t.id)}')">${fav ? "★" : "☆"}</span>
      <span class="cs">${esc(t.scoreText || "—")}</span></div>`;
  };
  const chip = m.state === "live" ? `<span class="chip live"><span class="dot"></span>LIVE${m.detail && m.detail.toLowerCase() !== "live" ? " · " + esc(m.detail) : ""}</span>`
    : m.state === "post" ? `<span class="chip ft">${esc(m.detail || "Result")}</span>`
    : `<span class="chip up">${fmtDay(m.ko)} ${fmtTime(m.ko)}</span>`;
  return `<div class="card ${m.state === "live" ? "live" : ""}">
    ${side(m.home)}${side(m.away)}
    <div class="meta">${chip}<span>${esc(m.venue)}</span></div></div>`;
}

function render() {
  const v = document.getElementById("view");
  let h = state.error ? `<div class="err">${state.error}</div>` : "";
  if (state.league !== "worldCup") {
    if (state.league === "cricket") {
      h += state.cricket.length
        ? state.cricket.map(s => `<div class="section">${esc(s.title).toUpperCase()}</div>` + s.ms.map(cricketCardHTML).join("")).join("")
        : `<div class="center">No cricket matches right now</div>`;
    } else {
      const pool = state[state.league] || [];
      h += pool.length ? pool.map(m => cardHTML(m, state.league)).join("")
        : `<div class="center">No ${state.league.toUpperCase()} games scheduled</div>`;
    }
    v.innerHTML = h; return;
  }
  if (state.tab === "matches") {
    const live = state.today.filter(m => m.state === "live");
    if (state.goalMsg && Date.now() - state.goalAt < 18e4)
      h += `<div class="banner goal"><b>${esc(state.goalMsg)}</b></div>`;
    if (live.length) {
      const nets = [...new Set(live.flatMap(m => m.nets))].join(" · ");
      h += `<div class="banner live"><span class="dot"></span><b>${live.length === 1 ? "LIVE NOW" : live.length + " MATCHES LIVE"}</b>${nets ? `<span>📺 ${esc(nets)}</span>` : ""}</div>`;
    } else {
      const next = [...state.today, ...state.tomorrow].find(m => m.state === "pre" && m.ko > new Date());
      if (next) {
        const s = Math.max(0, (next.ko - Date.now()) / 1000), soon = s <= 600;
        const cd = s >= 3600 ? `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`
                             : `${Math.floor(s / 60)}m ${String(Math.floor(s % 60)).padStart(2, "0")}s`;
        h += `<div class="banner count ${soon ? "soon" : ""}">${soon ? "🔔" : "⏱"}
          <div><b>${esc(next.home.name)} vs ${esc(next.away.name)}</b><br>
          <span style="color:var(--dim);font-size:11px">${soon ? "Starting soon!" : "Next kickoff"}</span></div>
          <span class="big">${cd}</span></div>`;
      }
    }
    h += state.today.length ? state.today.map(m => cardHTML(m)).join("")
       : (state.error ? "" : `<div class="center">No matches today</div>`);
    if (state.tomorrow.length) {
      h += `<div class="section">TOMORROW</div>` + state.tomorrow.map(m =>
        `<div class="row">${isFav(m, "worldCup") ? "⭐ " : ""}<span class="t">${esc(m.home.ab)} v ${esc(m.away.ab)}</span>
         <span class="when">${fmtDay(m.ko)} ${fmtTime(m.ko)}</span>
         <span style="color:var(--dim)">${esc(m.nets.slice(0, 2).join(" · "))}</span></div>`).join("");
    }
  } else if (state.tab === "groups") {
    h += state.groups.length ? state.groups.map(g => `<div class="card"><table>
      <tr><th>${esc(g.name)}</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
      ${g.rows.map(r => `<tr class="${r.rank <= 2 ? "q" : ""} ${state.favs.has("worldCup:" + r.id) ? "faved" : ""}">
        <td class="teamcell">${r.logo ? `<img src="${esc(r.logo)}" alt="" loading="lazy">` : ""}${esc(r.name)}</td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${esc(r.gd)}</td><td><b>${r.pts}</b></td></tr>`).join("")}
      </table></div>`).join("") : `<div class="center">Loading standings…</div>`;
  } else {
    h += state.bracket.length ? `<div class="center" style="padding:4px 0 10px">Road to the Final · July 19</div>` +
      state.bracket.map(r => `<div class="section">${esc(r.title).toUpperCase()}</div>` +
        r.ms.map(m => {
          const nm = t => t.name.length <= 3 ? `TBD (${esc(t.name)})` : esc(t.name);
          const c = m.state === "pre" ? `<span class="when">${fmtDay(m.ko)} ${fmtTime(m.ko)}</span>`
            : `<span class="c ${m.state === "live" ? "live" : ""}">${m.home.score ?? 0}–${m.away.score ?? 0}${m.state === "live" ? " · " + esc(m.clock) : ""}</span>`;
          return `<div class="row"><span class="t" style="text-align:right">${nm(m.home)}</span>${c}<span class="t">${nm(m.away)}</span></div>`;
        }).join("")).join("") : `<div class="center">Loading bracket…</div>`;
  }
  v.innerHTML = h;
}

refresh();
setInterval(refresh, 60e3);
setInterval(() => {
  if (state.league === "worldCup" && state.tab === "matches" && !state.today.some(m => m.state === "live")) render();
  updateTitle();
}, 1e3);
</script>
</body>
</html>
